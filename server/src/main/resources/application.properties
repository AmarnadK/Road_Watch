spring.application.name=road-watch-kozhikode
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Local development defaults: in-memory H2 database (no setup needed) ----
spring.datasource.url=jdbc:h2:mem:roadwatch;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Uploads ----
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# ---- Road Watch settings ----
roadwatch.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}
roadwatch.jwt.ttl-hours=12
roadwatch.rate-limit.per-hour=${RATE_LIMIT_PER_HOUR:10}
# Reject report locations outside Kozhikode district (set to false to test from elsewhere)
roadwatch.geofence.enabled=${GEOFENCE_ENABLED:true}
roadwatch.superadmin.username=${SUPERADMIN_USER:superadmin}
roadwatch.superadmin.password=${SUPERADMIN_PASSWORD:ChangeMe123!}
